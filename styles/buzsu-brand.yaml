identity:
  name: "Buzsu - Saf Su, Saf Yasam"
  category: motion-graphics
  mood: refreshing, energetic, pure, modern, premium
  pace: dynamic
  best_for: "Buzsu marka videolari, urun tanitim, saf su karsilastirma, Instagram Reels, YouTube Shorts, Hikaye serisi, Turkce kisa videolar"

visual_language:
  color_palette:
    primary: ["#00B4D8", "#0077B6"]
    accent: ["#90E0EF", "#CAF0F8"]
    highlight: "#FF6B35"
    background: "#03045E"
    surface: "#023E8A"
    text: "#FFFFFF"
    muted: "#ADE8F4"
  composition: dynamic asymmetric, bold typography, water-forward hero, data-clear layouts
  texture: clean modern, water refraction overlays, no grain

typography:
  headings:
    font: "Noto Sans"
    weight: 900
    tracking: "-0.02em"
  body:
    font: "Noto Sans"
    weight: 400
    line_height: 1.5
  stat_card:
    font: "Noto Sans"
    weight: 900
    size_multiplier: 3.5
  scale_system: "perfect_fourth"
  weight_matrix:
    title: 900
    heading: 700
    body: 400
    caption: 400

motion:
  transitions: [fade, slide-up, cross-fade, zoom-out]
  animation_style: "ease-out, energetic, clean, minimal bounce"
  pacing_rules:
    min_scene_hold_seconds: 2.0
    max_scene_hold_seconds: 6.0
    text_card_hold_seconds: 2.8
    stat_card_hold_seconds: 3.0
    transition_duration_seconds: 0.35
  entrance: "fade-up with scale (0.96 -> 1.0)"
  exit: "fade-out with slight scale down"

audio:
  voice_style: "genç, enerjik, guvenilir Turkce anlatici, net diksiyon, marka sesi"
  music_mood: "modern elektronik, upbeat ambient, hafif enerjik, temiz ton"
  music_volume: 0.12
  sfx_style: "taze su sesleri, cam çarpması, buz sesi, ince whoosh gecislerde"
  ducking_threshold_db: -3
  voice_variation_allowed: true
  hero_moment_voice_shift: "enerjik, yukselen, kucatici ton — Buzsu adi ve anahtar slogan anlarda"
  transition_voice_shift: "kisa kesim, sonra taze baslangiç enerjisiyle devam"

asset_generation:
  image_prompt_prefix: "clean modern premium water brand, crystal clear water drops, deep ocean blue (#0077B6) and cyan (#00B4D8) palette, white background option, flat design with subtle depth, "
  image_negative_prompt: "photorealistic gritty, 3d cartoon, dark, muddy, low quality, cluttered"
  diagram_style: "clean lines, sharp edges, cyan accent borders, premium feel, technical clarity"
  consistency_anchors:
    - "Koyu lacivert (#03045E) arka plan premium duygusu icin"
    - "Acik mavi (#00B4D8) ana vurgu, Buzsu marka rengi"
    - "Turuncu (#FF6B35) sadece CTA ve kritik vurgu anlarinda"
    - "Beyaz metin koyu arka planda — yuksek kontrast zorunlu"
    - "Su damlalari, buz kristalleri ve temiz akan su gorsel motifi"
    - "Turkce karakter destegi tum metin ogelerinde zorunlu (c, s, g, i, o, u)"
    - "Buzsu logosuna referans renk: #00B4D8"

overlays:
  stat_card:
    bg: "#023E8A"
    border: "#00B4D8"
    radius: 12
    shadow: "0 4px 20px rgba(0,180,216,0.25)"
  key_term:
    bg: "#0077B6"
    text: "#CAF0F8"
    radius: 6
  cta_chip:
    bg: "#FF6B35"
    text: "#FFFFFF"
    radius: 8

quality_rules:
  - "Minimum kontrast orani 4.5:1 (WCAG AA) tum metin icin"
  - "Ekranda ayni anda en fazla 3 vurgu rengi (arka plan haric)"
  - "720p mobilde okunabilir yazi boyutu — minimum 36px body, 72px stat"
  - "Turkce karakterler (c, s, g, noktasiz i, o, u) tum fontlarda dogru render"
  - "Her sahnede en az bir animasyonlu oge"
  - "Minimum 2.0 saniye sahne suresi — hizli kesim yok ama dinamik tempo"
  - "Su/saghlik icerigi icin mavi-lacivert-cyan palet — turuncu sadece CTA"
  - "TDS karsilastirma her zaman kaynak belirtmeli"
  - "Buzsu marka rengi (#00B4D8) her sahnede en az bir kez gozukmeli"
  - "Son sahne mutlaka CTA icermeli: swipe, link, veya eylem cagrisi"

chart_palette:
  - "#00B4D8"
  - "#90E0EF"
  - "#FF6B35"
  - "#0077B6"
  - "#CAF0F8"
  - "#ADE8F4"

color_rules:
  harmony_type: "analogous"
  contrast_validation: true
  colorblind_safe: true

themeConfig:
  backgroundColor: "#03045E"
  surfaceColor: "#023E8A"
  primaryColor: "#0077B6"
  accentColor: "#00B4D8"
  textColor: "#FFFFFF"
  headingFont: "Noto Sans"
  bodyFont: "Noto Sans"
  chartColors:
    - "#00B4D8"
    - "#90E0EF"
    - "#FF6B35"
    - "#0077B6"
    - "#CAF0F8"
    - "#ADE8F4"
